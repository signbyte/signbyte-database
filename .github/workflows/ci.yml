name: verify and publish migration image
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

# Verifies the migration set (the full testing/verify.sh walk: the ONE image
# migrates every deployment shape twice against a throwaway Postgres, plus the
# fail-closed refusal proofs) and, on success, publishes the migration image to
# ghcr.io/<owner>/<repo> (derived from the repository — no per-repo edit). A branch build pushes :<branch> (:main or
# :develop) and :<sha>; a version tag (v*) additionally pushes :<tag> and
# :latest — the image tag is the platform's schema version.
env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC — no key custody

jobs:
  # Publish gate: the repo's own end-to-end verify. It builds the image itself,
  # provisions the full role superset on a throwaway trust-auth Postgres (role
  # passwords generated at run time — zero secrets in the tree), migrates all
  # deployment shapes twice (idempotency), asserts schemas + history tables,
  # and proves the runner refuses an unknown location and a missing LOCATIONS.
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: End-to-end verify (all deployment shapes + fail-closed proofs)
      run: bash testing/verify.sh

  # Deep SQL quality gate — the same script a developer runs locally: all
  # locations applied into one database via the migration image, every SQL unit
  # test, every role-leak acceptance, and plpgsql_check static analysis over
  # every procedure (any 'error'-level finding fails).
  sql-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Unit tests + role-leak + plpgsql_check
      run: bash testing/sql-tests.sh

  # Migration immutability: an already-applied versioned (V) migration must never
  # be edited or deleted — Flyway checksums it, so a change silently diverges
  # environments (and fails validate). New schema changes go in a NEW V*.sql.
  # Repeatable R__ files are exempt (create-or-replace by design).
  migration-immutability:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    - name: No edits/deletes to already-applied versioned migrations
      run: |
        # A versioned migration becomes immutable the moment a real database has
        # applied it — Flyway checksums it, and the checksum covers comments too.
        #
        # TWO bases are checked and BOTH must be clean, because neither alone is enough:
        #
        #   schema-baseline — a tag pushed once the first databases run on this repo.
        #     Being FIXED, it still catches a V file edited several pushes ago, which a
        #     previous-push window silently misses.
        #   the previous push — catches an edit made in THIS push.
        #
        # Before the baseline tag exists the second base is the only one there is, so the
        # gate keeps enforcing instead of passing quietly — the window when files are
        # edited most freely is exactly the wrong time to stop checking. It skips only
        # when there is genuinely nothing to compare against, and says so loudly: a skip
        # must never read as a pass.
        set -u
        bases=""
        if git rev-parse -q --verify refs/tags/schema-baseline >/dev/null 2>&1; then
          bases="$bases schema-baseline"
        else
          echo "::warning::no schema-baseline tag yet — only this push is being compared. Tag it once the first databases run on this repo:  git tag schema-baseline && git push origin schema-baseline"
        fi
        before="${{ github.event.before }}"
        if [ -n "$before" ] && ! echo "$before" | grep -qE '^0+$' \
           && git cat-file -e "${before}^{commit}" 2>/dev/null; then
          bases="$bases $before"
        fi
        if [ -z "$(echo "$bases" | tr -d ' ')" ]; then
          echo "::warning::NOT ENFORCED on this run — no schema-baseline tag and no prior commit, so there is nothing to compare against. This is normal only on a repository's first push, where no database has applied anything yet."
          exit 0
        fi
        rc=0
        for base in $bases; do
          changed=$(git diff --diff-filter=MD --name-only "$base" "${{ github.sha }}" -- migrations/ \
                    | grep -E '/V[0-9][^/]*\.sql$' || true)
          if [ -n "$changed" ]; then
            echo "::error::Modifying or deleting an already-applied versioned migration is not allowed — add a NEW V*.sql instead. Offending file(s) since ${base}:"
            echo "$changed"
            rc=1
          fi
        done
        if [ "$rc" -ne 0 ]; then
          echo "Do NOT reach for 'flyway repair' to make this go away: it re-stamps the recorded"
          echo "checksum WITHOUT re-running the SQL, so the database keeps the old objects while the"
          echo "ledger claims the new file. Roll forward instead."
          exit 1
        fi
        echo "OK: no versioned migration modified or deleted (bases compared:${bases})"

  build-scan-push:
    needs: [verify, sql-quality, migration-immutability]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # Build once, locally, so SBOM + scan act on the exact bits that get pushed —
    # a failed check must never reach the registry.
    - name: Build image
      run: docker build -f Dockerfile.migrate --load -t "${{ env.IMAGE }}:${{ github.sha }}" .

    - name: Generate SBOM (syft, SPDX JSON)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ env.IMAGE }}:${{ github.sha }}
        artifact-name: sbom-database-${{ github.sha }}.spdx.json
        output-file: sbom-database-${{ github.sha }}.spdx.json

    # Report-only: the base is the upstream Flyway image we do not rebuild, so a
    # base finding surfaces here without blocking. Promote to a blocking gate
    # (exit-code 1) once a hardened base is chosen.
    - name: Trivy scan (report-only)
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}:${{ github.sha }}
        severity: HIGH,CRITICAL
        exit-code: '0'

    - name: Login to ghcr.io
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push tags (:sha always; :main/:develop on branch; :<tag> + :latest on a version tag)
      run: |
        docker push "${{ env.IMAGE }}:${{ github.sha }}"
        case "${{ github.ref }}" in
          refs/heads/main)
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:main"
            docker push "${{ env.IMAGE }}:main"
            ;;
          refs/heads/develop)
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:develop"
            docker push "${{ env.IMAGE }}:develop"
            ;;
          refs/tags/v*)
            tag="${GITHUB_REF#refs/tags/}"
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:${tag}"
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:latest"
            docker push "${{ env.IMAGE }}:${tag}"
            docker push "${{ env.IMAGE }}:latest"
            ;;
        esac

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image (keyless, GitHub OIDC — no key custody)
      run: |
        cosign sign --yes "${{ env.IMAGE }}@$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ github.sha }} | cut -d@ -f2)"
