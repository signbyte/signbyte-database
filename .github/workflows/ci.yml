name: verify and publish migration image
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

# Verifies the migration set (the full testing/verify.sh walk: the ONE image
# migrates every deployment shape twice against a throwaway Postgres, plus the
# fail-closed refusal proofs) and, on success, publishes the migration image to
# ghcr.io/<owner>/<repo> (derived from the repository — no per-repo edit). A branch build pushes :<branch> (:main or
# :develop) and :<sha>; a version tag (v*) additionally pushes :<tag> and
# :latest — the image tag is the platform's schema version.
# A tree that already passed the suite on a push is not tested again (the proven job; a version tag always runs it).
env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC — no key custody

jobs:
  # Test each tree once. A tree that already passed the suite (both `verify` and
  # `sql-quality` succeeded) in an earlier PUSH run of ci.yml is not tested again. The
  # same tree is what a develop push, the pull request that merges it, the push of the
  # merge and the version tag all carry, and each of those ran the whole suite.
  # Only a push run counts, because its commit is exactly what it tested (a pull request
  # run tests a merge commit that its record does not name), and only a run in which both
  # suite jobs SUCCEEDED, so a skipped suite never vouches for another one. A manual run
  # and a version tag always run the suite: the image published for a tag is built in its
  # own run, from a base that is not pinned, so it is tested there. Anything that goes wrong
  # in this lookup means "not proven" and the suite runs, even a failure of this job itself:
  # the two suite jobs run unless the lookup positively found a proof. A skip is announced
  # in the job's notice and summary, and the two suite jobs show as skipped.
  proven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Has this exact tree already passed the suite on a push?
      id: look
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node <<'JS'
        const { execFileSync } = require("node:child_process");
        const { appendFileSync } = require("node:fs");

        // The two jobs that make up "the suite". A run proves a tree only if both succeeded in it.
        const SUITE = ["verify", "sql-quality"];
        const api = process.env.GITHUB_API_URL || "https://api.github.com";
        const repo = process.env.GITHUB_REPOSITORY;
        const thisRun = String(process.env.GITHUB_RUN_ID);

        // A workflow command is one line: % and line breaks in a message are escaped, as GitHub asks.
        const escapeCommand = (text) => String(text).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");

        // found=true makes the two suite jobs skip. It is said in a notice, in the summary and in the output.
        function finish(found, level, message) {
          console.log(`::${level}::${escapeCommand(message)}`);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `found=${found}\n`);
        }

        async function get(path) {
          const res = await fetch(`${api}${path}`, {
            headers: {
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });
          if (!res.ok) throw new Error(`${path} answered ${res.status}`);
          return res.json();
        }

        async function look() {
          if (process.env.GITHUB_EVENT_NAME === "workflow_dispatch") {
            return finish(false, "notice", "A manual run: the suite runs.");
          }
          if ((process.env.GITHUB_REF || "").startsWith("refs/tags/")) {
            return finish(false, "notice", "A version tag: the suite runs, because the image published for it is built in this run.");
          }
          const tree = execFileSync("git", ["rev-parse", "HEAD^{tree}"], { encoding: "utf8" }).trim();
          const list = await get(`/repos/${repo}/actions/workflows/ci.yml/runs?event=push&status=completed&per_page=100`);
          for (const run of list.workflow_runs) {
            if (String(run.id) === thisRun || run.head_commit?.tree_id !== tree) continue;
            const { jobs } = await get(`/repos/${repo}/actions/runs/${run.id}/jobs?per_page=100`);
            if (SUITE.every((name) => jobs.some((job) => job.name === name && job.conclusion === "success"))) {
              return finish(true, "notice", `The suite did not run: tree ${tree.slice(0, 10)} already passed it in ${run.html_url} (commit ${run.head_sha.slice(0, 10)}).`);
            }
          }
          return finish(false, "notice", `No earlier push run passed the suite on tree ${tree.slice(0, 10)}: it runs now.`);
        }

        look().catch((err) => {
          // Never fail the run over this: an unanswered lookup means "not proven", so the suite runs.
          try {
            finish(false, "warning", `Could not look for an earlier proof (${err.message}): the suite runs.`);
          } catch (e) {
            console.log(`::warning::${escapeCommand(e.message)}`);
          }
        });
        JS

  # Publish gate: the repo's own end-to-end verify. It builds the image itself,
  # provisions the full role superset on a throwaway trust-auth Postgres (role
  # passwords generated at run time — zero secrets in the tree), migrates all
  # deployment shapes twice (idempotency), asserts schemas + history tables,
  # and proves the runner refuses an unknown location and a missing LOCATIONS.
  verify:
    needs: proven
    # Runs unless the lookup positively found a proof; a failed lookup job is not a proof.
    if: ${{ !cancelled() && needs.proven.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: End-to-end verify (all deployment shapes + fail-closed proofs)
      run: bash testing/verify.sh

  # Deep SQL quality gate — the same script a developer runs locally: all
  # locations applied into one database via the migration image, every SQL unit
  # test, every role-leak acceptance, and plpgsql_check static analysis over
  # every procedure (any 'error'-level finding fails).
  sql-quality:
    needs: proven
    # Runs unless the lookup positively found a proof; a failed lookup job is not a proof.
    if: ${{ !cancelled() && needs.proven.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Unit tests + role-leak + plpgsql_check
      run: bash testing/sql-tests.sh

  # Migration immutability: an already-applied versioned (V) migration must never
  # be edited or deleted — Flyway checksums it, so a change silently diverges
  # environments (and fails validate). New schema changes go in a NEW V*.sql.
  # Repeatable R__ files are exempt (create-or-replace by design).
  migration-immutability:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: No edits/deletes to already-applied versioned migrations
      run: |
        # A versioned migration becomes immutable the moment a real database has
        # applied it — Flyway checksums it, and the checksum covers comments too.
        #
        # TWO bases are checked and BOTH must be clean, because neither alone is enough:
        #
        #   schema-baseline — a tag pushed once the first databases run on this repo.
        #     Being FIXED, it still catches a V file edited several pushes ago, which a
        #     previous-push window silently misses.
        #   the previous push — catches an edit made in THIS push.
        #
        # Before the baseline tag exists the second base is the only one there is, so the
        # gate keeps enforcing instead of passing quietly — the window when files are
        # edited most freely is exactly the wrong time to stop checking. It skips only
        # when there is genuinely nothing to compare against, and says so loudly: a skip
        # must never read as a pass.
        set -u
        bases=""
        if git rev-parse -q --verify refs/tags/schema-baseline >/dev/null 2>&1; then
          bases="$bases schema-baseline"
        else
          echo "::warning::no schema-baseline tag yet — only this push is being compared. Tag it once the first databases run on this repo:  git tag schema-baseline && git push origin schema-baseline"
        fi
        before="${{ github.event.before }}"
        if [ -n "$before" ] && ! echo "$before" | grep -qE '^0+$' \
           && git cat-file -e "${before}^{commit}" 2>/dev/null; then
          bases="$bases $before"
        fi
        if [ -z "$(echo "$bases" | tr -d ' ')" ]; then
          echo "::warning::NOT ENFORCED on this run — no schema-baseline tag and no prior commit, so there is nothing to compare against. This is normal only on a repository's first push, where no database has applied anything yet."
          exit 0
        fi
        rc=0
        # A versioned migration is migrations/<location>/V<n>__<what>.sql, the only
        # shape the runner applies. A test fixture named for the version it tests
        # (migrations/testing/fixtures/<location>/V<n>.seed.sql) is never applied, and
        # changes when a later version changes what it can assert.
        for base in $bases; do
          changed=$(git diff --diff-filter=MD --name-only "$base" "${{ github.sha }}" -- migrations/ \
                    | grep -E '^migrations/[^/]+/V[0-9]+__[^/]*\.sql$' || true)
          if [ -n "$changed" ]; then
            echo "::error::Modifying or deleting an already-applied versioned migration is not allowed — add a NEW V*.sql instead. Offending file(s) since ${base}:"
            echo "$changed"
            rc=1
          fi
        done
        if [ "$rc" -ne 0 ]; then
          echo "Do NOT reach for 'flyway repair' to make this go away: it re-stamps the recorded"
          echo "checksum WITHOUT re-running the SQL, so the database keeps the old objects while the"
          echo "ledger claims the new file. Roll forward instead."
          exit 1
        fi
        echo "OK: no versioned migration modified or deleted (bases compared:${bases})"

  build-scan-push:
    needs: [proven, verify, sql-quality, migration-immutability]
    # The two suite jobs may be skipped only when `proven` succeeded and said this tree already
    # passed them; otherwise both must have succeeded, as before. The publish never runs on anything else.
    if: >-
      ${{ !cancelled()
      && needs.migration-immutability.result == 'success'
      && ((needs.proven.result == 'success' && needs.proven.outputs.found == 'true')
      || (needs.verify.result == 'success' && needs.sql-quality.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    # Build once, locally, so SBOM + scan act on the exact bits that get pushed —
    # a failed check must never reach the registry.
    - name: Build image
      run: docker build -f Dockerfile.migrate --load -t "${{ env.IMAGE }}:${{ github.sha }}" .

    - name: Generate SBOM (syft, SPDX JSON)
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        image: ${{ env.IMAGE }}:${{ github.sha }}
        artifact-name: sbom-database-${{ github.sha }}.spdx.json
        output-file: sbom-database-${{ github.sha }}.spdx.json
        # This workflow runs with contents: read. On a run whose tag has a GitHub
        # release, the action's default tries to attach the SBOM to that release,
        # which needs contents: write and fails the job with "Resource not
        # accessible by integration" — and everything after it (push, sign) is
        # skipped. The SBOM ships as a run artifact instead.
        upload-release-assets: false

    # Report-only: the base is the upstream Flyway image we do not rebuild, so a
    # base finding surfaces here without blocking. Promote to a blocking gate
    # (exit-code 1) once a hardened base is chosen.
    # The scanner runs from its own image, pinned by version and digest: the setup action's install script
    # downloads the binary from a host that does not resolve, so a runner with no cached binary cannot install it.
    - name: Trivy scan (report-only)
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
          image --severity HIGH,CRITICAL --exit-code 0 --no-progress "${{ env.IMAGE }}:${{ github.sha }}"

    - name: Login to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push tags (:sha always; :main/:develop on branch; :<tag> + :latest on a version tag)
      run: |
        docker push "${{ env.IMAGE }}:${{ github.sha }}"
        case "${{ github.ref }}" in
          refs/heads/main)
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:main"
            docker push "${{ env.IMAGE }}:main"
            ;;
          refs/heads/develop)
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:develop"
            docker push "${{ env.IMAGE }}:develop"
            ;;
          refs/tags/v*)
            tag="${GITHUB_REF#refs/tags/}"
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:${tag}"
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:latest"
            docker push "${{ env.IMAGE }}:${tag}"
            docker push "${{ env.IMAGE }}:latest"
            ;;
        esac

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image (keyless, GitHub OIDC — no key custody)
      run: |
        cosign sign --yes "${{ env.IMAGE }}@$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ github.sha }} | cut -d@ -f2)"
