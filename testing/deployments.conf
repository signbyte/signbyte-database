# Deployment shapes — the ONE place a deployment's locations and roles are declared.
# testing/verify.sh migrates every row (twice) and sql-tests.sh applies the union of
# all rows; a derived product repository carries only its own row, so the same
# scripts run unchanged there.
#
# Fields (pipe-separated, order matters):
#   name | LOCATIONS in apply order | service roles | human read schemas | human write schemas
#
# Roles are cluster-wide, so the scripts provision the UNION of every row before
# any database is migrated. The human read/write columns are the representative
# spread each shape exercises (deliberately not every schema, so the "a schema
# with no role gets no human grant" path is covered too).
signbyte|util identity document signflow envelope eidas_audit access_audit verify_audit trust_anchor grants|authbyte_public document_public envelope_public signing_public eidas_audit_public access_audit_public trust_anchor_public|identity document eidas_audit|document
